name: islamiapp
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  flutter_native_splash: ^2.4.8
  carousel_slider: ^5.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.12.0
  flutter_gen_runner:

flutter:
  uses-material-design: true

  assets:
    - assets/images/appimg/
    - assets/images/SVGimages/
    - assets/suras/
    - assets/Hadeeth/

  fonts:
    - family: jannah
      fonts:
        - asset: assets/fonts/JannaLTBold.ttf
          weight: 700